# promtool unit tests for the generated SLO rules: docker run --rm -v "$PWD/deploy/prometheus:/p" -w /p/tests #   --entrypoint promtool prom/prometheus:v3.15.1 test rules slo-rules.test.yml
# Synthetic series at a fixed 50 req/s (3,000 per minute). Each test states the behaviour it pins down.
rule_files:
  - ../rules/slo-rules.yml

evaluation_interval: 1m

tests:
  # 2 % of posts fail = 20x burn. Both the 1h/5m and the 6h/30m pairs exceed their thresholds -> both pages fire.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="201"}'
        values: '0+2940x120'
      - series: 'http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="500"}'
        values: '0+60x120'
      - series: 'http_server_request_duration_seconds_bucket{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="201",le="0.25"}'
        values: '0+2940x120'
      - series: 'http_server_request_duration_seconds_bucket{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="201",le="0.1"}'
        values: '0+2940x120'
    promql_expr_test:
      - expr: round(slo:burn_rate:rate1h{slo="ledger-post-availability"}, 0.1)
        eval_time: 10m
        exp_samples:
          - labels: '{slo="ledger-post-availability"}'
            value: 20
      - expr: slo:burn_rate:rate5m{slo="ledger-post-latency-p99"}
        eval_time: 10m
        exp_samples:
          - labels: 'slo:burn_rate:rate5m{slo="ledger-post-latency-p99"}'
            value: 0
    alert_rule_test:
      - eval_time: 10m
        alertname: LedgerPostAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: ledger-post-availability
              long_window: 1h
              short_window: 5m
            exp_annotations:
              summary: "ledger-post-availability: error budget burning faster than 14.4x over 1h and 5m"
              description: "99.9% of journal-entry posts do not fail with a 5xx. Burn rate over 1h: 20.0x. At 14.4x, 2% of the 30-day budget is gone within 1h."
              runbook_url: "https://github.com/hekimcan206/slo-chaos-lab/blob/main/docs/slo.md#runbook"
      - eval_time: 10m
        alertname: LedgerPostLatencyP99FastBurn
        exp_alerts: []

  # Healthy: 0.05 % errors (0.5x burn) for an hour. Nothing may page: precision matters as much as recall.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="201"}'
        values: '0+2998.5x60'
      - series: 'http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="500"}'
        values: '0+1.5x60'
      - series: 'http_server_request_duration_seconds_bucket{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="201",le="0.25"}'
        values: '0+2998.5x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: LedgerPostAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 60m
        alertname: LedgerPostAvailabilitySlowBurn
        exp_alerts: []

  # A 15-minute outage (100 % errors) followed by recovery. The page fires during the outage and clears once the
  # 5m window is clean, although the 1h burn rate is still far above 14.4: the short window is the reset.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="201"}'
        values: '0+3000x20 60000+0x15 60000+3000x40'
      - series: 'http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="500"}'
        values: '0+0x20 0+3000x15 45000+0x40'
      - series: 'http_server_request_duration_seconds_bucket{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="201",le="0.25"}'
        values: '0+3000x20 60000+0x15 60000+3000x40'
    promql_expr_test:
      - expr: slo:burn_rate:rate1h{slo="ledger-post-availability"} > 14.4
        eval_time: 50m
        exp_samples:
          - labels: 'slo:burn_rate:rate1h{slo="ledger-post-availability"}'
            value: 312.5
    alert_rule_test:
      - eval_time: 30m
        alertname: LedgerPostAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: ledger-post-availability
              long_window: 1h
              short_window: 5m
            exp_annotations:
              summary: "ledger-post-availability: error budget burning faster than 14.4x over 1h and 5m"
              description: "99.9% of journal-entry posts do not fail with a 5xx. Burn rate over 1h: 310.3x. At 14.4x, 2% of the 30-day budget is gone within 1h."
              runbook_url: "https://github.com/hekimcan206/slo-chaos-lab/blob/main/docs/slo.md#runbook"
      - eval_time: 50m
        alertname: LedgerPostAvailabilityFastBurn
        exp_alerts: []

  # Slow burn: 0.8 % errors (8x). Too slow for the 14.4x page, fast enough for the 6x page once 30m are bad.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="201"}'
        values: '0+2976x60'
      - series: 'http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="500"}'
        values: '0+24x60'
      - series: 'http_server_request_duration_seconds_bucket{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="201",le="0.25"}'
        values: '0+2976x60'
    alert_rule_test:
      - eval_time: 40m
        alertname: LedgerPostAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 40m
        alertname: LedgerPostAvailabilitySlowBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: ledger-post-availability
              long_window: 6h
              short_window: 30m
            exp_annotations:
              summary: "ledger-post-availability: error budget burning faster than 6x over 6h and 30m"
              description: "99.9% of journal-entry posts do not fail with a 5xx. Burn rate over 6h: 8.0x. At 6x, 5% of the 30-day budget is gone within 6h."
              runbook_url: "https://github.com/hekimcan206/slo-chaos-lab/blob/main/docs/slo.md#runbook"

  # Latency: 20 % of successful posts are slower than 250 ms but faster than 100 ms is never true for them.
  # p99 burn = 20 % / 1 % = 20x -> page; p95 burn = 20 % / 5 % = 4x -> no page. p50 has no alerts by design.
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="201"}'
        values: '0+3000x60'
      - series: 'http_server_request_duration_seconds_bucket{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="201",le="0.25"}'
        values: '0+2400x60'
      - series: 'http_server_request_duration_seconds_bucket{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code="201",le="0.1"}'
        values: '0+2400x60'
    alert_rule_test:
      - eval_time: 15m
        alertname: LedgerPostLatencyP99FastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: ledger-post-latency-p99
              long_window: 1h
              short_window: 5m
            exp_annotations:
              summary: "ledger-post-latency-p99: error budget burning faster than 14.4x over 1h and 5m"
              description: "99% of successful journal-entry posts complete within 250 ms. Burn rate over 1h: 20.0x. At 14.4x, 2% of the 30-day budget is gone within 1h."
              runbook_url: "https://github.com/hekimcan206/slo-chaos-lab/blob/main/docs/slo.md#runbook"
      - eval_time: 15m
        alertname: LedgerPostLatencyP95FastBurn
        exp_alerts: []
