        labels:
          slo: ledger-post-availability
      - record: slo:error_budget_remaining:ratio
        expr: 1 - slo:burn_rate:rate30d{slo="ledger-post-availability"}
        labels:
          slo: ledger-post-availability
      - alert: LedgerPostAvailabilityFastBurn
        expr: slo:burn_rate:rate1h{slo="ledger-post-availability"} > 14.4 and slo:burn_rate:rate5m{slo="ledger-post-availability"} > 14.4
        labels:
          severity: page
          slo: ledger-post-availability
          long_window: 1h
          short_window: 5m
        annotations:
          summary: "ledger-post-availability: error budget burning faster than 14.4x over 1h and 5m"
