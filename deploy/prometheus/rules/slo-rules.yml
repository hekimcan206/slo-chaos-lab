# GENERATED FILE. Do not edit by hand: change src/SloChaosLab.Slo/SloCatalog.cs and run
#   dotnet run --project tools/SloChaosLab.Chaos -- generate-rules
# A golden test fails when this file and the catalog disagree; deploy/prometheus/tests holds promtool tests.
#
# Multiwindow, multi-burn-rate alerts: Google SRE Workbook, ch. 5 "Alerting on SLOs"
# (https://sre.google/workbook/alerting-on-slos/). An alert fires only when both its long and its short
# window burn faster than the threshold. No `for:` clause: the short window already filters blips, and a
# `for:` would only delay detection.
groups:
  - name: slo-ledger-post-availability
    rules:
      - record: slo:objective:ratio
        expr: vector(0.999)
        labels:
          slo: ledger-post-availability
      - record: slo:sli_error:ratio_rate5m
        expr: (sum(rate(http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code=~"5.."}[5m])) or vector(0)) / sum(rate(http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST"}[5m]))
        labels:
          slo: ledger-post-availability
      - record: slo:sli_error:ratio_rate30m
        expr: (sum(rate(http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code=~"5.."}[30m])) or vector(0)) / sum(rate(http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST"}[30m]))
        labels:
          slo: ledger-post-availability
      - record: slo:sli_error:ratio_rate1h
        expr: (sum(rate(http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code=~"5.."}[1h])) or vector(0)) / sum(rate(http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST"}[1h]))
        labels:
          slo: ledger-post-availability
      - record: slo:sli_error:ratio_rate6h
        expr: (sum(rate(http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code=~"5.."}[6h])) or vector(0)) / sum(rate(http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST"}[6h]))
        labels:
          slo: ledger-post-availability
      - record: slo:sli_error:ratio_rate3d
        expr: (sum(rate(http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code=~"5.."}[3d])) or vector(0)) / sum(rate(http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST"}[3d]))
