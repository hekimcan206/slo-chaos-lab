          slo: ledger-post-availability
      - record: slo:sli_error:ratio_rate30d
        expr: (sum(rate(http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code=~"5.."}[30d])) or vector(0)) / sum(rate(http_server_request_duration_seconds_count{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST"}[30d]))
        labels:
          slo: ledger-post-availability
      - record: slo:burn_rate:rate5m
        expr: slo:sli_error:ratio_rate5m{slo="ledger-post-availability"} / 0.001
        labels:
          slo: ledger-post-availability
      - record: slo:burn_rate:rate30m
        expr: slo:sli_error:ratio_rate30m{slo="ledger-post-availability"} / 0.001
        labels:
          slo: ledger-post-availability
      - record: slo:burn_rate:rate1h
        expr: slo:sli_error:ratio_rate1h{slo="ledger-post-availability"} / 0.001
        labels:
          slo: ledger-post-availability
      - record: slo:burn_rate:rate6h
