        labels:
          slo: ledger-post-availability
      - record: slo:burn_rate:rate3d
        expr: slo:sli_error:ratio_rate3d{slo="ledger-post-availability"} / 0.001
        labels:
          slo: ledger-post-availability
      - record: slo:burn_rate:rate30d
