          runbook_url: "https://github.com/hekimcan206/slo-chaos-lab/blob/main/docs/slo.md#runbook"
      - alert: LedgerPostLatencyP99SlowBurn
        expr: slo:burn_rate:rate6h{slo="ledger-post-latency-p99"} > 6 and slo:burn_rate:rate30m{slo="ledger-post-latency-p99"} > 6
        labels:
          severity: page
          slo: ledger-post-latency-p99
          long_window: 6h
          short_window: 30m
        annotations:
          summary: "ledger-post-latency-p99: error budget burning faster than 6x over 6h and 30m"
          description: "99% of successful journal-entry posts complete within 250 ms. Burn rate over 6h: {{ $value | printf \"%.1f\" }}x. At 6x, 5% of the 30-day budget is gone within 6h."
          runbook_url: "https://github.com/hekimcan206/slo-chaos-lab/blob/main/docs/slo.md#runbook"
      - alert: LedgerPostLatencyP99BudgetErosion
        expr: slo:burn_rate:rate3d{slo="ledger-post-latency-p99"} > 1 and slo:burn_rate:rate6h{slo="ledger-post-latency-p99"} > 1
        labels:
          severity: ticket
          slo: ledger-post-latency-p99
          long_window: 3d
          short_window: 6h
        annotations:
          summary: "ledger-post-latency-p99: error budget burning faster than 1x over 3d and 6h"
          description: "99% of successful journal-entry posts complete within 250 ms. Burn rate over 3d: {{ $value | printf \"%.1f\" }}x. At 1x, 10% of the 30-day budget is gone within 3d."
          runbook_url: "https://github.com/hekimcan206/slo-chaos-lab/blob/main/docs/slo.md#runbook"
  - name: slo-latency-quantiles
    rules:
      - record: slo:latency_seconds:p50_rate1m
        expr: histogram_quantile(0.5, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code!~"5.."}[1m])))
      - record: slo:latency_seconds:p95_rate1m
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code!~"5.."}[1m])))
      - record: slo:latency_seconds:p99_rate1m
        expr: histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="ledger-api",http_route="/api/v1/journal-entries",http_request_method="POST",http_response_status_code!~"5.."}[1m])))
